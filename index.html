<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Gender Salary Gap Visualization (2015–2024)</title>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

<h1 class="title">Gender Salary Comparison (2015–2024)</h1>

<div class="control-container">
    <div class="year-prompt">Select Year to View Data</div>

    <div class="button-container">
        <button class="year-btn active" data-year="2015">2015</button>
        <button class="year-btn" data-year="2016">2016</button>
        <button class="year-btn" data-year="2017">2017</button>
        <button class="year-btn" data-year="2018">2018</button>
        <button class="year-btn" data-year="2019">2019</button>
        <button class="year-btn" data-year="2020">2020</button>
        <button class="year-btn" data-year="2021">2021</button>
        <button class="year-btn" data-year="2022">2022</button>
        <button class="year-btn" data-year="2023">2023</button>
        <button class="year-btn" data-year="2024">2024</button>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
